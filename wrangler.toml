name = "keep"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "keep.stoff.dev", custom_domain = true },
]

[observability]
enabled = true

[assets]
directory = "public"

[[r2_buckets]]
binding = "FILES"
bucket_name = "keep-files"

[triggers]
crons = ["0 * * * *"]

[[ratelimits]]
name = "MISSES"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
