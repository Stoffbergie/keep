[package]
name = "keep"
version = "0.2.0"
edition = "2021"
authors = ["Dirk Beukes"]
description = "Files from your terminal, kept forever"
license = "MIT"
repository = "https://github.com/Stoffbergie/keep"
keywords = ["cli", "upload", "files", "share"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
futures = "0.3"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["fs", "io-std", "io-util", "rt"] }

tokio-util = { version = "0.7", features = ["io"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
