[package]
name = "keep"
version = "0.7.1"
edition = "2021"
authors = ["Dirk Beukes"]
description = "Share files from your terminal with a link."
license = "MIT"
repository = "https://github.com/Stoffbergie/keep"
keywords = ["cli", "upload", "files", "share"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
console = "0.15"
dirs = "5.0"
futures = { version = "0.3", default-features = false, features = ["std"] }
httpdate = "1.0"
indicatif = "0.17"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = { version = "3.27", default-features = false }
tokio = { version = "1.43", features = ["fs", "io-std", "io-util", "process", "rt", "signal"] }

tokio-util = { version = "0.7", features = ["io"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = "z"

[profile.release.package.arboard]
opt-level = 3

[profile.release.package.image]
opt-level = 3

[profile.release.package.tiff]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3
